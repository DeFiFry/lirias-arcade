<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Liria's Arcade</title>
<link rel="icon" type="image/x-icon" href="/assets/Liria-Arcade-Icon.ico" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="scanlines" aria-hidden="true"></div>

<audio id="bgm" src="/music/alice.mp3" loop preload="auto"></audio>

<section id="select-screen" class="screen active">
  <div class="select-overlay">
    <button id="choose-game-btn" class="choose-btn">CHOOSE GAME</button>
  </div>
</section>

<section id="grid-screen" class="screen">
  <header class="grid-header">
    <h1>SELECT YOUR GAME</h1>
    <p class="grid-hint">Arrow keys / D-pad to move &middot; Enter / A to open/launch &middot; Esc / B to go back</p>
  </header>
  <div id="game-grid" class="category-list"></div>
  <p id="grid-empty" class="grid-empty" hidden>No games found yet. Drop ROMs into <code>/roms/&lt;system&gt;</code> or HTML5 games into <code>/arcade-collection</code>.</p>
</section>

<div id="player-overlay" class="player-overlay" hidden>
  <button id="player-close" class="player-close">&times; CLOSE</button>
  <iframe id="player-frame" class="player-frame" title="Game"></iframe>
</div>

<div id="toast" class="toast" hidden></div>

<div class="corner-controls">
  <button id="music-btn" class="corner-btn music-btn" type="button" title="Turn music off" aria-label="Turn music off" aria-pressed="false">
    <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" focusable="false">
      <path d="M10.4 3.1v8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
      <path d="M10.4 3.1c.3 1.7 1.3 2.4 3.1 2.7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
      <ellipse cx="8" cy="11.1" rx="2.4" ry="1.9" fill="currentColor" />
      <line class="music-slash music-slash-cut" x1="2.6" y1="2.6" x2="13.4" y2="13.4" stroke-width="3" stroke-linecap="round" />
      <line class="music-slash" x1="2.6" y1="2.6" x2="13.4" y2="13.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
    </svg>
  </button>
  <button id="exit-btn" class="corner-btn exit-btn" title="Stop the arcade server">EXIT</button>
</div>

<script src="app.js"></script>
</body>
</html>
